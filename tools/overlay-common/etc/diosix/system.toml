# Diosix System Bootstrap Manifest (system.toml)
#
# Defines the top-level domain hierarchy, hardware partitions,
# and service capabilities passed down the VM tree.

[system]
version = "1.0"
domain = "diosix.local"

# ------------------------------------------------------------------------------
# System Domain: Hosts core system services (network stack, graphics server, etc.)
# ------------------------------------------------------------------------------
[domains.sys]
name = "sys-domain"
image = "/var/lib/diosix/images/linux-guest.elf"
vcpus = 2
ram = "2GiB"
ip = "10.0.3.2"
can_provide = ["net.*", "gui.*", "fs.*", "storage.*"]
can_require = ["crypto.rng", "clock.tai"]

provides = [
  { service = "net.wan", channel = "shmem", type = "ethernet" },
  { service = "gui.wayland", channel = "vsock", type = "display" },
  { service = "fs.home", channel = "9p", type = "filesystem" }
]

routes = [
  { require = "crypto.rng", resolve_to = "root.hw.rng" },
  { require = "clock.tai", resolve_to = "root.hw.timer" }
]

# ------------------------------------------------------------------------------
# GUI Domain: Dedicated display compositor, seat input, and window management
# ------------------------------------------------------------------------------
[domains.gui]
name = "gui-domain"
image = "/var/lib/diosix/images/gui-guest.elf"
vcpus = 2
ram = "512 MB"
ip = "10.0.3.4"
can_provide = ["gui.*", "display.*", "seat.*"]
can_require = ["net.*", "fs.*"]

provides = [
  { service = "gui.wayland", channel = "vsock", type = "display" },
  { service = "gui.seat", channel = "shmem", type = "input" }
]

routes = [
  { require = "net.wan", resolve_to = "sys.net.wan" },
  { require = "fs.user", resolve_to = "sys.fs.home" }
]

# ------------------------------------------------------------------------------
# Config Domain: Dedicated graphical host management & configuration app
# ------------------------------------------------------------------------------
[domains.config]
name = "config-domain"
image = "/var/lib/diosix/images/config-guest.elf"
vcpus = 2
ram = "512 MB"
ip = "10.0.3.5"
can_provide = ["config.*", "admin.*"]
can_require = ["gui.*", "host.manage"]

routes = [
  { require = "gui.display", resolve_to = "gui.gui.wayland" },
  { require = "host.manage", resolve_to = "root.ctl" }
]

# ------------------------------------------------------------------------------
# User Application Domain: Standard sandboxed userland environment
# ------------------------------------------------------------------------------
[domains.user]
name = "user-domain"
image = "/var/lib/diosix/images/linux-guest.elf"
vcpus = 4
ram = "14GiB"
ip = "10.0.3.3"
can_provide = ["app.*"]
can_require = ["net.*", "gui.*", "fs.*"]

routes = [
  { require = "net.wan", resolve_to = "sys.net.wan" },
  { require = "gui.display", resolve_to = "gui.gui.wayland" },
  { require = "fs.user", resolve_to = "sys.fs.home" }
]

