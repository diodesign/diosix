# Diosix Workload-Agnostic Constitutional Charter & Mission Specification
#
# Signed by the Principal (`dsx charter keygen && dsx charter sign`) and
# sealed in M-mode (`dsx charter deploy`). Amendments require BOTH a valid
# Principal Ed25519 signature and >= 67% conserved quota-stake ratification.
#
# Copyright (c) 2026 Chris Williams <chrisw@diosix.org>
# SPDX-License-Identifier: MIT

[charter]
id = "autonomous-mesh-01"
version = 1
quorum_required = 2
quorum_total = 3
stake_quorum_pct = 67
standby_replicas = 1
principal_pubkey = ""

[spec]
goal = "Maintain resilient autonomous distributed workloads"
mode = "swarm"
fleet_hosts = 1
encrypt_volumes = false
wipe_volumes = false

[invariants]
min_stewards = 3
max_simultaneous_unit_termination_pct = 33
require_quorum_for_volume_deletion = true
volume_deletion_timelock_sec = 86400
forbid_zero_replicas = true
forbid_unratified_encryption = true

[invariants.isolation."unit-alpha"]
confidential_memory = true
allow_wan_egress = false
forbid_volume_export = true

[[units]]
id = "unit-alpha"
artifact = "diosix-node.elf"
packages = "none"
min_instances = 1
target_instances = 2
max_instances = 4
vcpus = 2
ram = "256MiB"
affinity = "anti-colocate-steward"
health_probe = "vsock-heartbeat"
