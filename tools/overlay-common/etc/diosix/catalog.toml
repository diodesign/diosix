# Diosix guest OS & autonomic steward image catalog (/etc/diosix/catalog.toml)
#
# This DNF/APT-style repository configuration defines the remote images and
# OS installers available to `dsx image catalog`, `dsx image pull <id>`, and
# `dsx install-guest <id>`.
#
# Every catalog entry pins a trusted 64-character hexadecimal `sha256` digest
# shipped inside the Root VM root of trust. `dsx image pull` and
# `dsx install-guest` verify downloaded artifacts against this locally pinned
# digest and fail closed on any mismatch.
#
# Administrators and operator agents may edit this file to point `url` and
# `sha256` fields at upstream OS distribution mirrors, local LAN HTTPS/HTTP
# servers, or `file://` paths without recompiling `dsx`.
#
# Copyright (c) 2026 Chris Williams <chrisw@diosix.org>
# SPDX-License-Identifier: MIT

[[image]]
id = "diosix-linux"
alias = "base-linux"
title = "Diosix Base Linux"
tier = "leaf"
os_family = "linux"
format = "elf"
arch = "riscv64"
default_vcpus = 2
default_ram_mb = 512
default_disk_mb = 1024
filename = "diosix-linux.elf"
url = "https://images.diosix.org/26.2/riscv64/diosix-linux.elf"
sha256 = "5123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

