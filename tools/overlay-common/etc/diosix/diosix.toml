# Diosix System & CLI Runtime Configuration (/etc/diosix/diosix.toml)
#
# Centralizes user- and maintainer-tunable defaults for the `dsx` (`diosix-ctl`)
# management tool, default child VM sizing, repository paths, and the
# interactive guided tour.
#
# Permissions: 0644 (root:root)
# Copyright (c) 2026 Chris Williams <chrisw@diosix.org>
# SPDX-License-Identifier: MIT

[vm_defaults]
default_vcpus = 1
default_ram = "256 MB"
default_disk_mb = 1024
install_default_disk_mb = 4096
default_arch = "riscv64"
subnet_prefix = "10.0.3."
root_retained_pcpu_pct = 10

[paths]
images_dir = "/var/lib/diosix/images"
iso_dir = "/var/lib/diosix/iso"
disks_dir = "/var/lib/diosix/disks"
snapshots_dir = "/var/lib/diosix/snapshots"
keys_dir = "/var/lib/diosix/keys"
system_manifest = "/etc/diosix/system.toml"
catalog_config = "/etc/diosix/catalog.toml"
charter_config = "/etc/diosix/charter.toml"
constitution_doc = "/etc/diosix/constitution.md"
install_config = "/etc/diosix/install.toml"

[[tour]]
title = "Step 1/5: Root VM & Hardware Isolation"
summary = "Root VM (CID 1) manages drivers, storage, and child VMs via SBI."
cli_hint = "dsx host info && dsx info"

[[tour]]
title = "Step 2/5: Zero-Password Passkey Security"
summary = "Password login is disabled; operators use FIDO2, TPM2, QR, or UART."
cli_hint = "dsx auth status && dsx auth list"

[[tour]]
title = "Step 3/5: Guest OS & Image Catalog"
summary = "Pull SHA-256 verified Guest OS ISOs and Steward VMs from catalog."
cli_hint = "dsx image catalog && dsx image list"

[[tour]]
title = "Step 4/5: Autonomic Steward Collective & Charter"
summary = "Steward VMs enforce the sealed M-mode Charter via M-of-N quorums."
cli_hint = "dsx charter status"

[[tour]]
title = "Step 5/5: Live Test-Drive & Host Installation"
summary = "Install the Diosix boot image and state volume onto NVMe or VirtIO."
cli_hint = "dsx host install --mode basic --dry-run"

