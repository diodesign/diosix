# Default firewall configuration for Diosix VMs.
# Generated for strict hierarchical isolation and zero-trust inter-VM
# containment.
#
# Copyright (c) 2026 Chris Williams <chrisw@diosix.org>
# SPDX-License-Identifier: MIT

*filter
:INPUT DROP [0:0]
:FORWARD DROP [0:0]
:OUTPUT ACCEPT [0:0]

# 1. Allow all loopback traffic (localhost communications).
-A INPUT -i lo -j ACCEPT

# 2. Allow established and related connections (stateful inspection).
-A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT

# 3. Allow ICMP for network diagnostics and PMTU discovery.
-A INPUT -p icmp -j ACCEPT

# 4. Allow SSH (Dropbear) on port 22.
-A INPUT -p tcp --dport 22 -m conntrack --ctstate NEW -j ACCEPT

# 5. Allow APK proxy, LLM proxy, and parent board on diosix0.
-A INPUT -i diosix0 -p tcp --dport 8080 -m conntrack --ctstate NEW -j ACCEPT
-A INPUT -i diosix0 -p tcp --dport 8081 -m conntrack --ctstate NEW -j ACCEPT
-A INPUT -i diosix0 -p tcp --dport 8485 -m conntrack --ctstate NEW -j ACCEPT

# 6. Allow multi-host fleet mesh on WAN/LAN NIC only (never from diosix0).
-A INPUT ! -i diosix0 -p tcp --dport 8486 -m conntrack --ctstate NEW -j ACCEPT

COMMIT
