# Default firewall configuration for Diosix VMs
# Generated for stateful isolation and secure inter-VM communications

*filter
:INPUT DROP [0:0]
:FORWARD DROP [0:0]
:OUTPUT ACCEPT [0:0]

# 1. Allow all loopback traffic (localhost communications)
-A INPUT -i lo -j ACCEPT

# 2. Allow established and related connections (stateful inspection)
-A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT

# 3. Allow ICMP for network diagnostics and PMTU discovery
-A INPUT -p icmp -j ACCEPT

# 4. Allow SSH (Dropbear / OpenSSH) on port 22
-A INPUT -p tcp --dport 22 -m conntrack --ctstate NEW -j ACCEPT

# 5. Allow Diosix hypervisor inter-VM virtual network subnet (10.0.3.0/24)
-A INPUT -s 10.0.3.0/24 -j ACCEPT

# 6. Allow forwarding between guest VMs on the Diosix virtual subnet
-A FORWARD -s 10.0.3.0/24 -d 10.0.3.0/24 -j ACCEPT
-A FORWARD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT

COMMIT
