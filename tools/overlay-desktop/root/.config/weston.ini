[core]
backend=drm-backend.so
shell=desktop-shell.so
use-pixman=true
require-input=false
idle-time=0

[shell]
background-color=0xff162438
panel-position=top
locking=false
animation=none
startup-animation=none

[libinput]
enable-tap=true

[keyboard]
repeat-delay=650
repeat-rate=20

[terminal]
font=DejaVu Sans Mono
font-size=16
term=xterm-256color
