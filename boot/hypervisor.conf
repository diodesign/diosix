# Diosix M-mode Hypervisor Build-Time Configuration (boot/hypervisor.conf)
#
# Defines hardware sizing and resource allocation defaults compiled into the
# bare-metal M-mode hypervisor before any guest filesystem is mounted.
# Sourced by scripts/build.sh and exposed as build.zig options
# (-Droot-ram-min-mb, -Droot-ram-max-mb, -Droot-ram-divisor, -Droot-vcpus-max).
#
# Copyright (c) 2026 Chris Williams <chrisw@diosix.org>
# SPDX-License-Identifier: MIT

# Minimum RAM allocated to the Root VM in MiB (kernel + initramfs + GUI/CLI)
ROOT_RAM_MIN_MB=128

# Hard cap on Root VM RAM in MiB so large hosts reserve >99% RAM for child VMs
ROOT_RAM_MAX_MB=256

# Host physical RAM divisor for Root VM scaling (8 = 1/8th or 12.5% host RAM)
ROOT_RAM_HOST_DIVISOR=8

# Maximum virtual CPU cores allocated to the Root VM
ROOT_VCPUS_MAX=4
