name: Diosix continuous integration

on:
  push:
    branches:
      - devel
      - stable
  pull_request:
    branches:
      - devel
      - stable

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/stable' }}

jobs:
  ubuntu-build:
    name: Ubuntu 26.04 build and test
    timeout-minutes: 90
    # Use ubuntu-latest for external fork PRs; otherwise use self-hosted.
    runs-on: >-
      ${{ (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository) &&
      'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Reclaim disk space on ephemeral GitHub-hosted runners
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: true

      - name: Build Docker container
        run: >-
          docker build -f dockerfiles/ubuntu-26.04.Dockerfile
          -t diosix-ubuntu .

      - name: Check formatting and run unit and feature-graph tests
        run: |
          docker run --rm diosix-ubuntu sh -ec '
            zig fmt --check build.zig build hypervisor tools scripts
            ./scripts/build.sh test --summary all
          '

      - name: Build hypervisor, root VM, and live disk image
        run: |
          docker run --rm \
            -v diosix-ubuntu-zig-out:/diosix/zig-out \
            diosix-ubuntu sh -ec '
              ./scripts/build.sh
              ./scripts/make_live_image.sh
            '

      - name: Run full-stack QEMU integration tests
        run: |
          docker run --rm \
            -v diosix-ubuntu-zig-out:/diosix/zig-out \
            diosix-ubuntu python3 scripts/test_manifest_integration.py

      - name: Clean up Docker image
        if: always()
        run: docker rmi diosix-ubuntu || true

  fedora-build:
    name: Fedora 44 build and test
    timeout-minutes: 90
    # Keeps the same secure, dynamic runner logic for the Fedora pipeline.
    runs-on: >-
      ${{ (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository) &&
      'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Reclaim disk space on ephemeral GitHub-hosted runners
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: true

      - name: Build Docker container
        run: >-
          docker build -f dockerfiles/fedora-44.Dockerfile
          -t diosix-fedora .

      - name: Check formatting and run unit and feature-graph tests
        run: |
          docker run --rm diosix-fedora sh -ec '
            zig fmt --check build.zig build hypervisor tools scripts
            ./scripts/build.sh test --summary all
          '

      - name: Build hypervisor, root VM, and live disk image
        run: |
          docker run --rm \
            -v diosix-fedora-zig-out:/diosix/zig-out \
            diosix-fedora sh -ec '
              ./scripts/build.sh
              ./scripts/make_live_image.sh
            '

      - name: Run full-stack QEMU integration tests
        run: |
          docker run --rm \
            -v diosix-fedora-zig-out:/diosix/zig-out \
            diosix-fedora python3 scripts/test_manifest_integration.py

      - name: Clean up Docker image
        if: always()
        run: docker rmi diosix-fedora || true
